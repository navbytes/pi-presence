name: publish-npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack & validate only (no publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing (no stored NPM_TOKEN)

jobs:
  publish:
    name: publish to npm (trusted publishing)
    if: inputs.dry-run || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Validate immutable release version
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then exit 0; fi
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.RELEASE_VERSION;
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const paths = fs.readdirSync('packages').filter(p => fs.existsSync(`packages/${p}/package.json`));
          for (const path of paths) {
            const pkg = JSON.parse(fs.readFileSync(`packages/${path}/package.json`, 'utf8'));
            if (!pkg.private && pkg.version !== version) throw new Error(`Version mismatch: ${pkg.name}`);
          }
          NODE
      - run: npm ci
      # Trusted publishing (OIDC) + provenance require npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm run check
      - run: npm run build

      - name: publish
        run: |
          # On a real run, OIDC trusted publishing authenticates automatically
          # (no NPM_TOKEN) and --provenance attaches a provenance statement.
          publish_package() {
            workspace="$1"
            version=$(npm pkg get version --workspace "$workspace" --json | jq -r 'to_entries[0].value')
            name=$(npm pkg get name --workspace "$workspace" --json | jq -r 'to_entries[0].value')
            if [ "$FLAG" != --dry-run ] && npm view "$name@$version" version >/dev/null 2>&1; then return; fi
            npm publish --workspace "$workspace" --access public $FLAG
          }
          FLAG="--provenance"
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            FLAG="--dry-run"
            echo "::notice::DRY RUN — packing and validating, nothing will be published"
          fi
          echo "::group::pi-presence (extension)"
          publish_package pi-presence
          echo "::endgroup::"
          echo "::group::pi-presence-watch (reader CLI)"
          publish_package pi-presence-watch
          echo "::endgroup::"
