name: publish-npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack & validate only (no publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing (no stored NPM_TOKEN)

jobs:
  publish:
    name: publish to npm (trusted publishing)
    if: inputs.dry-run || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # Trusted publishing (OIDC) + provenance require npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm run check
      - run: npm run build

      - name: publish
        run: |
          # On a real run, OIDC trusted publishing authenticates automatically
          # (no NPM_TOKEN) and --provenance attaches a provenance statement.
          publish_package() {
            workspace="$1"
            version=$(npm pkg get version --workspace "$workspace" --json | jq -r 'to_entries[0].value')
            name=$(npm pkg get name --workspace "$workspace" --json | jq -r 'to_entries[0].value')
            if [ "$FLAG" != --dry-run ] && npm view "$name@$version" version >/dev/null 2>&1; then return; fi
            npm publish --workspace "$workspace" --access public $FLAG
          }
          FLAG="--provenance"
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            FLAG="--dry-run"
            echo "::notice::DRY RUN — packing and validating, nothing will be published"
          fi
          echo "::group::pi-presence (extension)"
          publish_package pi-presence
          echo "::endgroup::"
          echo "::group::pi-presence-watch (reader CLI)"
          publish_package pi-presence-watch
          echo "::endgroup::"
